[project]
name = "finance-tracker"
version = "0.1.0"
description = "Import bank statements from CSV, categorize expenses and show monthly overviews."
readme = "README.md"
authors = [
    { name = "Petr Dedek", email = "32178784+storgall@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
finance-tracker = "finance_tracker:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
disallow_untyped_defs = true
warn_unused_ignores = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
