[project]
name = "finance-tracker"
version = "0.1.0"
description = "Command-line tool that imports Moneta bank statements (XML), sorts every transaction into categories using your own keyword rules, skips accounts you want to ignore (e.g. savings), and prints an income and expense overview. Pure Python standard library, exact Decimal money handling, fully typed and tested."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Petr Dedek", email = "32178784+storgall@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
finance-tracker = "finance_tracker:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
disallow_untyped_defs = true
warn_unused_ignores = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
